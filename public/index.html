<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ask-whale</title>
<meta name="description" content="Ask the whale about You Li's work.">
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --border: #d1d9e0; --link: #0969da; --err: #cf222e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --fg: #f0f6fc; --muted: #9198a1; --border: #3d444d; --link: #4493f8; --err: #f85149; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    max-width: 760px; margin: 0 auto; padding: 32px 16px 48px;
    min-height: 100dvh; display: flex; flex-direction: column;
  }
  a { color: var(--link); }
  pre { margin: 0 0 24px; font: inherit; white-space: pre; overflow-x: auto; }
  b { font-weight: 600; }
  #log { flex: 1; }
  .q { margin-top: 16px; font-weight: 600; white-space: pre-wrap; overflow-wrap: anywhere; }
  .a { margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .a.err { color: var(--err); }
  .a.cmd { color: var(--muted); }
  .a.pending::after { content: "▌"; animation: blink 1.06s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .suggest { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; }
  .suggest button {
    font: inherit; color: var(--muted); background: none; cursor: pointer;
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px;
  }
  .suggest button:hover { color: var(--fg); }
  form {
    display: flex; align-items: center; gap: 8px; margin-top: 24px;
    border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px;
  }
  form:focus-within { border-color: var(--link); }
  input { flex: 1; min-width: 0; font: inherit; color: var(--fg); background: none; border: 0; outline: 0; }
  input::placeholder { color: var(--muted); }
  form button { font: inherit; color: var(--link); background: none; border: 0; cursor: pointer; }
  form button:disabled { color: var(--muted); cursor: default; }
  #turnstile { margin-top: 12px; }
  footer { margin-top: 12px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<pre>
<b>~/you-li</b> <i>main</i>
<b>❯ ask-whale</b>
                <span id="hat">? ?</span>
             .-'''-.  _
            <span id="face">( o  ‿  )</span>/ )      <span id="caption">ask me about you li's work.</span>
             '-...-'\_/
</pre>

<div id="log"></div>

<div class="suggest" id="suggest">
  <button type="button">what is kernel-agent?</button>
  <button type="button">what does you li work on?</button>
  <button type="button">how does raft-go elect a leader?</button>
</div>

<form id="form">
  <b>❯</b>
  <input id="input" maxlength="500" autocomplete="off" placeholder="ask me anything, or type /help" aria-label="your question">
  <button id="send" aria-label="ask">↵</button>
</form>
<div id="turnstile"></div>
<footer>answers by claude, may be wrong · <a href="https://github.com/LiYou22">back to profile</a></footer>

<script>
  // Public by design; the matching secret lives in the Worker as TURNSTILE_SECRET.
  const TURNSTILE_SITE_KEY = "0x4AAAAAAFpKO7gkWPfn_y3W";
  let widgetId = null;
  let token = null;
  const tokenWaiters = [];

  window.onTurnstileLoad = () => {
    widgetId = turnstile.render("#turnstile", {
      sitekey: TURNSTILE_SITE_KEY,
      appearance: "interaction-only",
      callback: (t) => {
        token = t;
        tokenWaiters.splice(0).forEach((resolve) => resolve());
      },
      "expired-callback": () => { token = null; },
    });
  };

  // Tokens are single-use, so take the current one and start solving the next.
  async function nextToken() {
    if (!token) {
      await Promise.race([
        new Promise((resolve) => tokenWaiters.push(resolve)),
        new Promise((_, reject) => setTimeout(
          () => reject(new Error("verification didn't load. disable content blockers or refresh.")), 15000)),
      ]);
    }
    const t = token;
    token = null;
    turnstile.reset(widgetId);
    return t;
  }
</script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad&render=explicit" async defer></script>

<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const suggest = document.getElementById("suggest");
  const history = [];
  let busy = false;

  // Parts are plain strings or {text, href}; built with the DOM, never innerHTML.
  function addLine(cls, ...parts) {
    const el = document.createElement("div");
    el.className = cls;
    for (const part of parts) {
      if (typeof part === "string") {
        el.append(part);
      } else {
        const a = document.createElement("a");
        a.href = part.href;
        a.textContent = part.text;
        el.append(a);
      }
    }
    log.append(el);
    el.scrollIntoView({ block: "end" });
    return el;
  }

  // [hat, face, caption]. Faces stay 9 chars wide so the body doesn't shift.
  const MOODS = {
    idle:     ["? ?", "( o  ‿  )", "ask me about you li's work."],
    thinking: [". o O", "( -  ‿  )", "thinking..."],
    reading:  ["[ ]", "( o  ‿  )", "reading the code..."],
    happy:    ["~ ~", "( ^  ‿  )", "there you go."],
    sorry:    [" ;", "( -  _  )", "can't help with that one."],
    broken:   ["x x", "( x  ‿  )", "something broke."],
    sleepy:   ["z z", "( -  ‿  )", "zzz... come back tomorrow."],
    confused: [" ?", "( o  .  )", "huh?"],
  };
  const hat = document.getElementById("hat");
  const face = document.getElementById("face");
  const caption = document.getElementById("caption");
  let moodTimers = [];

  function later(fn, ms) {
    moodTimers.push(setTimeout(fn, ms));
  }

  function setMood(name, backToIdleMs) {
    moodTimers.forEach(clearTimeout);
    moodTimers = [];
    [hat.textContent, face.textContent, caption.textContent] = MOODS[name];
    if (backToIdleMs) later(() => setMood("idle"), backToIdleMs);
  }

  function whaleTrick() {
    const frames = [
      ["~", "( o  ‿  )"], ["~ ~", "( ^  ‿  )"], ["~ ~ ~", "( ^  ▽  )"],
      ["~ ~ ~ ~", "( ^  ▽  )"], ["~ ~", "( -  ‿  )"],
    ];
    setMood("happy");
    caption.textContent = "*splash*";
    frames.forEach(([h, f], i) => {
      later(() => {
        [hat.textContent, face.textContent] = [h, f];
        if (i === frames.length - 1) later(() => setMood("happy", 2000), 300);
      }, i * 300);
    });
  }

  const PROJECTS = [
    ["kernel-agent", "small llm writes verified tiled kernels on trainium"],
    ["raft-go", "raft consensus in go"],
    ["earth", "real-time earth–moon–sun sim · three.js + glsl"],
    ["Text-to-Medical-Images-Synthesis", "text-conditioned diffusion for chest x-rays"],
  ];

  // Handled in the page, never sent to the model. Returns false for real questions.
  function runCommand(raw) {
    const cmd = raw.toLowerCase();
    const known = ["/help", "/projects", "/about", "/whale", "/clear", "ls", "clear", "whoami", "exit"];
    if (!cmd.startsWith("/") && !cmd.startsWith("sudo ") && !known.includes(cmd)) return false;

    if (cmd === "/clear" || cmd === "clear") {
      log.replaceChildren();
      history.length = 0;
      setMood("idle");
      return true;
    }

    addLine("q", "❯ " + raw);
    if (cmd === "/help") {
      addLine("a cmd", [
        "/projects   list my projects   (or: ls)",
        "/about      what is this",
        "/whale      ask the whale to do a trick",
        "/clear      start over         (or: clear)",
        "anything else goes to the whale.",
      ].join("\n"));
    } else if (cmd === "/projects" || cmd === "ls") {
      for (const [name, desc] of PROJECTS) {
        addLine("a cmd", { text: name, href: `https://github.com/LiYou22/${name}` }, `  ${desc}`);
      }
      addLine("a cmd", "more at ", { text: "github.com/LiYou22", href: "https://github.com/LiYou22" });
    } else if (cmd === "/about") {
      addLine("a cmd", "a tiny agent that knows you li's public repos. answers by claude, may be wrong. source: ",
        { text: "github.com/LiYou22/ask-whale", href: "https://github.com/LiYou22/ask-whale" });
    } else if (cmd === "/whale") {
      addLine("a cmd", "the whale does a little flip.");
      whaleTrick();
      return true;
    } else if (cmd === "whoami") {
      addLine("a cmd", "a visitor. the whale is glad you're here.");
    } else if (cmd === "exit") {
      addLine("a cmd", "there is no exit, only the ocean. (try /clear)");
    } else if (cmd.startsWith("sudo ")) {
      addLine("a cmd", "nice try. the whale doesn't have root either.");
      setMood("sorry", 3000);
      return true;
    } else {
      addLine("a cmd", `command not found: ${raw}. try /help`);
      setMood("confused", 3000);
      return true;
    }
    setMood("happy", 3000);
    return true;
  }

  async function ask(question) {
    busy = true;
    send.disabled = true;
    suggest.remove();
    setMood("thinking");
    addLine("q", "❯ " + question);
    const out = addLine("a pending", "");
    history.push({ role: "user", content: question });

    let answer = "";
    let error = null;
    let sig = null;
    let mood = "broken";
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "content-type": "application/json" },
        // The Worker only reads the last 9 turns; don't upload more.
        body: JSON.stringify({ messages: history.slice(-9), token: await nextToken() }),
      });
      if (!res.ok) {
        if (res.status === 429) mood = "sleepy";
        throw new Error(await res.text());
      }

      const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
      let buf = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += value;
        const lines = buf.split("\n");
        buf = lines.pop();
        for (const line of lines) {
          if (!line) continue;
          const msg = JSON.parse(line);
          if (msg.reset) answer = "";
          if (msg.text) answer += msg.text;
          if (msg.tool) {
            out.before(addLine("a cmd", "↳ " + msg.tool));
            setMood("reading");
          }
          if (msg.error) error = msg.error;
          if (msg.refusal) mood = "sorry";
          if (msg.sig) sig = msg.sig;
          out.textContent = answer;
          out.scrollIntoView({ block: "end" });
        }
      }
    } catch (err) {
      error = err.message || "network error, try again.";
    }

    out.classList.remove("pending");
    if (!error && !sig) error = "connection dropped, try again.";
    if (error) {
      out.classList.add("err");
      out.textContent = error;
      history.pop();
      setMood(mood, 6000);
    } else {
      history.push({ role: "assistant", content: answer, sig });
      setMood("happy", 4000);
    }
    busy = false;
    send.disabled = false;
    input.focus();
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q || busy) return;
    input.value = "";
    if (!runCommand(q)) ask(q);
  });

  suggest.addEventListener("click", (e) => {
    if (e.target.tagName === "BUTTON" && !busy) ask(e.target.textContent);
  });

  input.focus();
</script>
</body>
</html>
