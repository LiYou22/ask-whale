name = "ask-whale"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "public"

[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# Rate-limit counters. Durable Objects need no ids, so this file has nothing
# account-specific and works as-is for anyone who deploys it.
[[durable_objects.bindings]]
name = "LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

[vars]
MODEL = "claude-sonnet-5-5"
PER_IP_DAILY = "20"
# Worst case is ~$0.03 per code-reading question, so 100/day stays near $100/month.
GLOBAL_DAILY = "100"
